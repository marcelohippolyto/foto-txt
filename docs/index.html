<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Foto para TXT</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--muted:#5b6470;--accent:#1f6feb;--line:#dde1e7}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--fg:#e8ebef;--muted:#9aa4b0;--accent:#4c8dff;--line:#2a313a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  main{max-width:640px;margin:0 auto;display:grid;gap:14px}
  h1{font-size:22px;margin:4px 0 0}
  p.sub{margin:0;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
  button,.btn,select{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:14px;min-height:48px}
  .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;text-align:center;cursor:pointer;display:block}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=file]{display:none}
  #preview{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--bg)}
  textarea{width:100%;min-height:260px;font:16px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
  progress{width:100%;height:10px}
  .status{color:var(--muted);font-size:14px;min-height:20px}
  [hidden]{display:none!important}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
  <div>
    <h1>Foto para TXT</h1>
    <p class="sub">Tire uma foto de um texto e receba o conteúdo em arquivo .txt. Tudo é processado no seu celular.</p>
  </div>

  <section class="card">
    <label class="btn primary" for="cam">📷 Tirar foto</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <label class="btn" for="gal" style="text-align:center">🖼️ Escolher da galeria</label>
    <input id="gal" type="file" accept="image/*">
    <label>Idioma do texto
      <select id="lang" style="width:100%;margin-top:6px">
        <option value="por">Português</option>
        <option value="eng">Inglês</option>
        <option value="por+eng">Português + Inglês</option>
      </select>
    </label>
  </section>

  <section class="card" id="work" hidden>
    <img id="preview" alt="Foto escolhida">
    <progress id="bar" max="1" value="0" hidden></progress>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="card" id="result" hidden>
    <textarea id="text" aria-label="Texto reconhecido"></textarea>
    <div class="row">
      <button id="copy">Copiar</button>
      <button id="save" class="primary">Salvar .txt</button>
    </div>
    <button id="share" hidden>Compartilhar…</button>
  </section>
</main>
<script src="lib/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
